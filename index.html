<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Fotos</title>
    <meta name="color-scheme" content="dark">
    <meta name="theme-color" content="#0b0d10">
    <style>
      :root { color-scheme: dark; font-family: system-ui, sans-serif; background: #0b0d10; color: #f1f3f5; }
      * { box-sizing: border-box; }
      body { margin: 0; -webkit-font-smoothing: antialiased; }
      main { max-width: 1680px; margin: auto; padding: 28px 16px 64px; }
      header { margin-bottom: 24px; padding-bottom: 24px; }
      p { margin: 0; }
      #event-name { font-size: clamp(26px, 3vw, 38px); font-weight: 550; letter-spacing: -.045em; line-height: 1.15; }
      button { border: 0; padding: 0; background: transparent; color: inherit; font: inherit; cursor: pointer; -webkit-tap-highlight-color: transparent; }
      button:focus-visible { outline: 2px solid #b1ccff; outline-offset: 5px; }
      .photo-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); align-items: start; gap: 8px; }
      .photo-grid + .photo-grid { margin-top: clamp(48px, 6vw, 88px); }
      .photo-grid button { min-width: 0; border-radius: 8px; contain: layout paint; }
      .photo-grid img { display: block; width: 100%; height: auto; aspect-ratio: auto 4 / 3; border-radius: 8px; }
      [hidden] { display: none !important; }
      html:has(dialog[open]) { overflow: hidden; }
      dialog { position: fixed; inset: 0; width: 100%; height: 100dvh; max-width: none; max-height: none; margin: 0; border: 0; padding: 0; background: #08090c; color: #f1f3f5; }
      dialog::backdrop { background: #08090c; }
      .viewer-content { position: relative; display: grid; height: 100%; grid-template-rows: auto minmax(0, 1fr) auto; }
      dialog form { display: flex; justify-content: flex-end; padding: max(12px, env(safe-area-inset-top)) 16px 12px; }
      dialog button { display: flex; align-items: center; justify-content: center; width: 48px; height: 48px; border: 1px solid #ffffff22; border-radius: 50%; background: #15181e; touch-action: manipulation; }
      #photo-stage { position: relative; min-height: 0; padding: 0 12px; touch-action: pan-y pinch-zoom; overflow: hidden; }
      #photo-frame { height: 100%; width: 100%; transition: transform 140ms ease-out; }
      #photo-frame.dragging { transition: none; }
      #full-photo { display: block; width: 100%; height: 100%; object-fit: contain; user-select: none; -webkit-user-drag: none; }
      #photo-error { position: absolute; bottom: 16px; left: 50%; transform: translateX(-50%); width: max-content; max-width: calc(100% - 32px); padding: 12px 16px; border-radius: 8px; background: #15181e; font-size: 14px; text-align: center; }
      .viewer-controls { display: flex; align-items: center; justify-content: center; gap: 28px; padding: 20px 16px max(20px, env(safe-area-inset-bottom)); }
      #position { min-width: 88px; text-align: center; font-size: 13px; font-variant-numeric: tabular-nums; color: #a3aab8; }
      @media (min-width: 640px) {
        main { padding: 44px 32px 80px; }
        header { margin-bottom: 32px; padding-bottom: 28px; }
        .photo-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
      }
      @media (min-width: 900px) {
        #photo-stage { padding: 0 88px; }
        #previous, #next { position: absolute; top: 50%; z-index: 1; transform: translateY(-50%); width: 52px; height: 52px; }
        #previous { left: 20px; }
        #next { right: 20px; }
      }
      @media (min-width: 1200px) {
        main { padding-inline: 48px; }
        .photo-grid { grid-template-columns: repeat(4, minmax(0, 1fr)); }
      }
      @media (prefers-reduced-motion: reduce) { #photo-frame { transition: none; } }
    </style>

    <dialog id="viewer" aria-label="Visualização da foto">
      <div class="viewer-content">
        <form method="dialog">
          <button type="submit" autofocus aria-label="Fechar foto">
            <svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="m6 6 12 12M18 6 6 18"/></svg>
          </button>
        </form>
        <div id="photo-stage">
          <div id="photo-frame"><img id="full-photo" alt="" draggable="false"></div>
          <p id="photo-error" role="status" hidden>Não foi possível carregar esta foto.</p>
        </div>
        <div class="viewer-controls">
          <button id="previous" type="button" aria-label="Foto anterior">
            <svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="m14 6-6 6 6 6"/></svg>
          </button>
          <p id="position" aria-live="polite" aria-atomic="true"></p>
          <button id="next" type="button" aria-label="Próxima foto">
            <svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="m10 6 6 6-6 6"/></svg>
          </button>
        </div>
      </div>
    </dialog>

    <script>
      const gallery = document.querySelector('#gallery');
      const viewer = document.querySelector('#viewer');
      const frame = document.querySelector('#photo-frame');
      const stage = document.querySelector('#photo-stage');
      const photoError = document.querySelector('#photo-error');
      const position = document.querySelector('#position');
      const photos = [...gallery.querySelectorAll('button[data-index]')];
      let current = 0;
      let revision = 0;
      let detailTimer;
      let pendingImage;
      let gesture;

      function cancelDetail() {
        clearTimeout(detailTimer);
        if (pendingImage) {
          pendingImage.onload = pendingImage.onerror = null;
          pendingImage.removeAttribute('src');
          pendingImage = null;
        }
      }

      function resetGesture() {
        gesture = null;
        frame.classList.remove('dragging');
        frame.style.transform = '';
      }

      function showPhoto(index) {
        cancelDetail();
        resetGesture();
        const request = ++revision;
        current = (index + photos.length) % photos.length;
        const thumbnail = photos[current].querySelector('img');
        const preview = new Image();
        preview.id = 'full-photo';
        preview.alt = '';
        preview.draggable = false;
        preview.decoding = 'async';
        preview.fetchPriority = 'high';
        preview.onload = () => {
          if (request === revision && frame.firstElementChild === preview) photoError.hidden = true;
        };
        preview.onerror = () => {
          if (request === revision && frame.firstElementChild === preview) photoError.hidden = false;
        };
        preview.src = thumbnail.currentSrc || thumbnail.src;
        frame.replaceChildren(preview);
        photoError.hidden = true;
        viewer.setAttribute('aria-label', `Foto ${photos[current].dataset.id}`);
        position.textContent = `${current + 1} / ${photos.length}`;
        stage.setAttribute('aria-busy', 'true');

        // Rapid navigation uses the small preview; only the selected photo gets a large image.
        detailTimer = setTimeout(() => {
          if (!viewer.open || request !== revision) return;
          const detail = new Image();
          pendingImage = detail;
          detail.id = 'full-photo';
          detail.alt = '';
          detail.draggable = false;
          detail.decoding = 'async';
          detail.fetchPriority = 'high';
          detail.onload = async () => {
            try { await detail.decode(); } catch { /* A loaded image can still be displayed. */ }
            if (!viewer.open || request !== revision) return;
            detail.onload = detail.onerror = null;
            frame.replaceChildren(detail);
            pendingImage = null;
            photoError.hidden = true;
            stage.setAttribute('aria-busy', 'false');
          };
          detail.onerror = () => {
            if (!viewer.open || request !== revision) return;
            pendingImage = null;
            stage.setAttribute('aria-busy', 'false');
            photoError.hidden = preview.complete && preview.naturalWidth > 0;
          };
          detail.src = thumbnail.dataset.full;
        }, 120);
      }

      gallery.addEventListener('click', (e) => {
        const button = e.target.closest('button[data-index]');
        if (!button) return;
        showPhoto(photos.indexOf(button));
        viewer.showModal();
      });

      document.querySelector('#previous').addEventListener('click', () => showPhoto(current - 1));
      document.querySelector('#next').addEventListener('click', () => showPhoto(current + 1));
      viewer.addEventListener('keydown', (e) => {
        if (e.altKey || e.ctrlKey || e.metaKey || e.shiftKey) return;
        if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') {
          e.preventDefault();
          showPhoto(current + (e.key === 'ArrowRight' ? 1 : -1));
        }
      });

      stage.addEventListener('pointerdown', (e) => {
        if (!e.isPrimary) { resetGesture(); return; }
        if (e.button !== 0) return;
        gesture = { id: e.pointerId, x: e.clientX, y: e.clientY };
        stage.setPointerCapture(e.pointerId);
      });
      stage.addEventListener('pointermove', (e) => {
        if (!gesture || e.pointerId !== gesture.id) return;
        const dx = e.clientX - gesture.x;
        const dy = e.clientY - gesture.y;
        if (Math.abs(dx) > 8 && Math.abs(dx) > Math.abs(dy)) {
          frame.classList.add('dragging');
          frame.style.transform = `translateX(${Math.max(-72, Math.min(72, dx * .35))}px)`;
        }
      });
      stage.addEventListener('pointerup', (e) => {
        if (!gesture || e.pointerId !== gesture.id) return;
        const dx = e.clientX - gesture.x;
        const dy = e.clientY - gesture.y;
        resetGesture();
        if (stage.hasPointerCapture(e.pointerId)) stage.releasePointerCapture(e.pointerId);
        if (Math.abs(dx) > 48 && Math.abs(dx) > Math.abs(dy) * 1.5) {
          showPhoto(current + (dx < 0 ? 1 : -1));
        }
      });
      stage.addEventListener('pointercancel', resetGesture);
      stage.addEventListener('lostpointercapture', resetGesture);
      viewer.addEventListener('close', () => {
        revision++;
        cancelDetail();
        resetGesture();
        frame.replaceChildren();
        stage.setAttribute('aria-busy', 'false');
      });
    </script>
